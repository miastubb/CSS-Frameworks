<!-- @format -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Noroff Frameworks project, using Vite and Tailwind CSS"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&display=swap"
      rel="stylesheet"
    />

    <title>tw-project</title>
  </head>
  <body>
    <div id="header"></div>

    <div
      class="mx-auto mt-25 w-full max-w-160 rounded-lg border border-(--color-border) bg-linear-to-b from-(--color-picker) from-0% via-(--color-picker-secondary) via-25% to-(--color-surface) to-100% p-12 text-white shadow-md"
    >
      <h1 class="logo mb-3 text-4xl tracking-tight text-(--color-primary)">
        WELCOME TO THE WIRE
      </h1>
      <h3 class="mb-4 text-2xl text-white/90">
        Follow posts, join the conversation, and share your own updates.
      </h3>
      <p class="mb-6 text-lg text-(--color-text-muted)">
        Log in to explore the feed, react to posts, comment on discussions, and
        connect with other users.
      </p>

      <div class="flex gap-4">
        <a href="login/index.html" class="btn btn-login">Login</a>
        <a href="register/index.html" class="btn btn-register">Register</a>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
