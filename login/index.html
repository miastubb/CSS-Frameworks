<div
  class="bg-neutral-primary-soft border-default rounded-base w-full max-w-sm border p-6 shadow-xs"
>
  <form action="#">
    <h5 class="text-heading mb-6 text-xl font-semibold">
      Sign in to our platform
    </h5>
    <div class="mb-4">
      <label for="email" class="text-heading mb-2.5 block text-sm font-medium"
        >Your email</label
      >
      <input
        type="email"
        id="email"
        class="bg-neutral-secondary-medium border-default-medium text-heading rounded-base focus:ring-brand focus:border-brand placeholder:text-body block w-full border px-3 py-2.5 text-sm shadow-xs"
        placeholder="example@company.com"
        required
      />
    </div>
    <div>
      <label
        for="password"
        class="text-heading mb-2.5 block text-sm font-medium"
        >Your password</label
      >
      <input
        type="password"
        id="password"
        class="bg-neutral-secondary-medium border-default-medium text-heading rounded-base focus:ring-brand focus:border-brand placeholder:text-body block w-full border px-3 py-2.5 text-sm shadow-xs"
        placeholder="•••••••••"
        required
      />
    </div>
    <div class="my-6 flex items-start">
      <div class="flex items-center">
        <input
          id="checkbox-remember"
          type="checkbox"
          value=""
          class="border-default-medium bg-neutral-secondary-medium focus:ring-brand-soft h-4 w-4 rounded-xs border focus:ring-2"
        />
        <label
          for="checkbox-remember"
          class="text-heading ms-2 text-sm font-medium"
          >Remember me</label
        >
      </div>
      <a
        href="#"
        class="text-fg-brand ms-auto text-sm font-medium hover:underline"
        >Lost Password?</a
      >
    </div>
    <button
      type="submit"
      class="bg-brand hover:bg-brand-strong focus:ring-brand-medium rounded-base mb-3 box-border w-full border border-transparent px-4 py-2.5 text-sm leading-5 font-medium text-white shadow-xs focus:ring-4 focus:outline-none"
    >
      Login to your account
    </button>
    <div class="text-body text-sm font-medium">
      Not registered?
      <a href="#" class="text-fg-brand hover:underline">Create account</a>
    </div>
  </form>
</div>
